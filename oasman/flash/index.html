<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>OAS-Man installer</title>
		<meta name="description" content="Easily allow users to install OAS-Man firmware on the web." />
		<meta name="viewport" content="width=device-width" />
		<meta name="color-scheme" content="dark light" />
		<style>
			body {
				font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
				padding: 0;
				margin: 0;
				line-height: 1.4;
			}
			.content {
				max-width: 600px;
				margin: 0 auto;
				padding: 12px;
			}
			h2 {
				margin-top: 2em;
			}
			h3 {
				margin-top: 1.5em;
			}
			a {
				color: #03a9f4;
			}
			.invisible {
				visibility: hidden;
			}
			.hidden {
				display: none;
			}
			esp-web-install-button[install-unsupported] {
				visibility: inherit;
			}
			.content pre {
				max-width: 100%;
				overflow-y: scroll;
			}
			.footer {
				margin-top: 24px;
				border-top: 1px solid #ccc;
				padding-top: 24px;
				text-align: center;
			}
			.footer .initiative {
				font-style: italic;
				margin-top: 16px;
			}
			table {
				border-spacing: 0;
			}
			td {
				padding: 8px;
				border-bottom: 1px solid #ccc;
			}
			.radios li {
				list-style: none;
				line-height: 2em;
			}
			@media (prefers-color-scheme: dark) {
				body {
					background-color: #333;
					color: #fff;
				}
				a {
					color: #58a6ff;
				}
			}
		</style>
		<script type="module" src="https://unpkg.com/esp-web-tools@8.0.1/dist/web/install-button.js?module"></script>
		<script src="manifestgen.js"></script>
	</head>
	<body>
		<div class="content">
			<h1>OAS-Man installer</h1>
			<p>Select your product</p>
			<!-- <ul class="radios" id="firmwareRadioOptions">
				<li>
					<label><input type="radio" name="type" value="manifold" /> Manifold (Board &gt;= v3.2)</label>
				</li>
				<li>
					<label><input type="radio" name="type" value="manifold_no_acc" /> Manifold (Board &lt; v3.2, No accessory wire input reading code)</label>
				</li>
				<li>
					<label><input type="radio" name="type" value="controller" /> Controller</label>
				</li>
				<li hidden id="hiddentestoption">
					<label><input type="radio" name="type" value="test" /> Manifold (TEST)</label>
				</li>
			</ul> -->

			<ul class="radios" id="firmwareRadioOptions">
				<li>
					<label><input type="radio" name="type" value="manifold" /> Manifold Firmwares</label>
				</li>
				<li>
					<label><input type="radio" name="type" value="controller" /> Controller Firmwares</label>
				</li>
			</ul>

			<select id="firmwareFilesSelect" hidden>
				<option value="NONE">NOTHING SELECTED</option>
			</select>


			<small id="versionnum">Version --</small>
			<p class="button-row" align="center">
				<esp-web-install-button class="invisible"></esp-web-install-button>
			</p>

			<div class="footer"><a href="https://github.com/gopro2027/ArduinoAirSuspensionController">OAS-Man</a> &mdash; Installer powered by <a href="https://esphome.github.io/esp-web-tools/">ESP Web Tools</a>.</div>
		</div>
		<script>

			// rest link: https://api.github.com/repos/gopro2027/gopro2027.github.io/contents/oasman/firmware/controller


			// load version txt file
			function loadFile(filePath) {
				var result = null;
				var xmlhttp = new XMLHttpRequest();
				xmlhttp.open("GET", filePath, false);
				xmlhttp.send();
				if (xmlhttp.status == 200) {
					result = xmlhttp.responseText;
				}
				return result;
			}
			let versionnum = loadFile("https://oasman.dev/oasman/version.txt");
			console.log(versionnum);
			const element = document.getElementById("versionnum");
			element.textContent = "Latest Version " + versionnum;

			

			// document.querySelectorAll('input[name="type"]').forEach((radio) =>
			// 	radio.addEventListener("change", () => {
			// 		const button = document.querySelector("esp-web-install-button");
			// 		button.manifest = `../manifest_${radio.value}.json`;
			// 		button.classList.remove("invisible");
			// 	})
			// );

			var chosenType = "";
			var chosenFileName = "";

			function setSelectedFile(fileName) {
				chosenFileName = fileName;

				const button = document.querySelector("esp-web-install-button");
				if (fileName.length > 0) {
					var genurl = generate_manifest(chosenType, "OASMan Firmware: "+chosenType,"999",fileName);
					console.log(genurl);
					button.manifest = genurl;
					button.classList.remove("invisible");
				} else {
					button.classList.add("invisible");
				}
			}

			function loadFirmwareFiles(link) {

				setSelectedFile("");

				var defaultSelectionFirmware = "firmware_"+versionnum+".bin";
				filesData = JSON.parse(loadFile(link));

				selectorObject = document.getElementById('firmwareFilesSelect');
				selectorObject.hidden = false;
				selectorObject.innerHTML = "";

				for (a of filesData) {
					console.log(a.name);
					var opt = document.createElement('option');
					opt.value = a.name;
					opt.innerHTML = a.name;
					//opt.selected = a.name.includes(versionnum);
					selectorObject.appendChild(opt);
					if (a.name.includes(defaultSelectionFirmware)) {
						console.log("selecting "+a.name);
						selectorObject.value = a.name;
						setSelectedFile(a.name);
					}
				}
			}

			document.getElementById('firmwareFilesSelect').addEventListener('change', (event) => {
				setSelectedFile(event.target.value);

				console.log(`Selected value: ${event.target.value}`);
			});

			document.querySelectorAll('input[name="fileSelector"]').forEach((radio) =>
				radio.addEventListener("change", () => {
					const button = document.querySelector("esp-web-install-button");
					button.manifest = `../manifest_${radio.value}.json`;
					button.classList.remove("invisible");
				})
			);

			document.querySelectorAll('input[name="type"]').forEach((radio) =>
				radio.addEventListener("change", () => {
					chosenType = radio.value;
					
					if (radio.value == "manifold") {
						loadFirmwareFiles("https://api.github.com/repos/gopro2027/gopro2027.github.io/contents/oasman/firmware/manifold");
					} else {
						loadFirmwareFiles("https://api.github.com/repos/gopro2027/gopro2027.github.io/contents/oasman/firmware/controller");
					}
				})
			);

			// check hidden test
			const urlParams = new URLSearchParams(window.location.search);
			const myParam = urlParams.get('test');
			if (urlParams.has('test')) {
				document.getElementById('hiddentestoption').hidden = false;
			}
		</script>
	</body>
</html>
