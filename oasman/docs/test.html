<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
		<meta name="description" content="" />
		<meta name="author" content="" />

		<title>SB Admin 2 - Dashboard</title>

		<!-- Custom fonts for this template-->
		<link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css" />
		<link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
		<script src="https://rawcdn.githack.com/oscarmorrison/md-page/master/md-page.js"></script>

		<!-- Custom styles for this template-->
		<link href="css/sb-admin-2.min.css" rel="stylesheet" />
	</head>

	<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

	<script>
		async function getRawFile(url) {
			try {
				const response = await fetch(url);
				if (!response.ok) {
					throw new Error(`HTTP error! status: ${response.status}`);
				}
				const text = await response.text();
				return text;
			} catch (error) {
				console.error("Error fetching the file:", error);
				return null;
			}
		}

		// Example usage:

		const rawUrl = "https://raw.githubusercontent.com/gopro2027/ArduinoAirSuspensionController/refs/heads/main/README.md";

		document.addEventListener("DOMContentLoaded", function () {
			getRawFile(rawUrl).then((content) => {
				if (content) {
					console.log(content);
					const myDiv = document.getElementById("readmecontent");
					myDiv.innerHTML = marked.parse(content);
					document.getElementById("readmecontent2").innerHTML = marked.parse(content);
				} else {
					console.log("Failed to get the file content.");
				}
			});
		});
	</script>

	<body>
		<div class="container-fluid">
			<div class="row">
				<div class="col-12">
					<div id="readmecontent">Loading....</div>
				</div>
				<div class="col-12">
					<div class="card border-left-primary shadow h-100 py-2 container-lg px-3 my-5">
						<div class="card-body">
							<div class="row no-gutters align-items-center">
								<div class="col mr-2">
									<div id="readmecontent2">Loading....</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
