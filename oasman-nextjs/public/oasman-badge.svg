<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .badge-text { font-family: Arial, sans-serif; font-weight: bold; fill: #0099ff; }
      .badge-accent { fill: none; stroke: #0099ff; stroke-width: 3; }
    </style>
  </defs>
  
  <!-- Center suspension components -->
  <g transform="translate(200, 200)">
    <!-- Left cylinder -->
    <rect x="-60" y="-40" width="50" height="80" rx="8" fill="#0099ff" opacity="0.9"/>
    <rect x="-58" y="-35" width="46" height="70" fill="#1a1a1a"/>
    
    <!-- Right cylinder -->
    <rect x="10" y="-40" width="50" height="80" rx="8" fill="#0099ff" opacity="0.9"/>
    <rect x="12" y="-35" width="46" height="70" fill="#1a1a1a"/>
    
    <!-- Connection bar -->
    <rect x="-35" y="50" width="70" height="8" rx="4" fill="#0099ff"/>
    
    <!-- Est. text on bar -->
    <text x="0" y="58" text-anchor="middle" class="badge-text" font-size="10">EST.2022</text>
  </g>
  
  <!-- Circle border with dashes -->
  <circle cx="200" cy="200" r="180" class="badge-accent" stroke-dasharray="20,10"/>
  
  <!-- Corner elements -->
  <path d="M 40 40 L 60 40 L 60 60" class="badge-accent" stroke-width="4" stroke-linecap="round"/>
  <path d="M 360 40 L 340 40 L 340 60" class="badge-accent" stroke-width="4" stroke-linecap="round"/>
  <path d="M 40 360 L 60 360 L 60 340" class="badge-accent" stroke-width="4" stroke-linecap="round"/>
  <path d="M 360 360 L 340 360 L 340 340" class="badge-accent" stroke-width="4" stroke-linecap="round"/>
</svg>
